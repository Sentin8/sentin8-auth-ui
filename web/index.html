<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sentin8">
  <link rel="apple-touch-icon" href="assets/assets/logos/sentin8-logo-icon.svg">

  <!-- Favicon - Sentin8 shield mark -->
  <link rel="icon" type="image/svg+xml" href="assets/assets/logos/sentin8-logo-icon.svg"/>

  <title>Sentin8 Sign In</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Override CanvasKit URL to use the local dev server copy instead of
       the gstatic.com CDN (unreachable in offline/air-gapped environments).
       The dev server serves CanvasKit at /canvaskit/ (same origin). -->
  <script>
    (function () {
      var cfg = { canvasKitBaseUrl: '/canvaskit/' };
      var realLoader = null;
      if (!window._flutter) window._flutter = {};
      Object.defineProperty(window._flutter, 'loader', {
        get: function () {
          if (!realLoader) return undefined;
          return new Proxy(realLoader, {
            get: function (target, prop) {
              if (prop === 'load') {
                return function (c) { return target.load(Object.assign({}, cfg, c || {})); };
              }
              return target[prop];
            }
          });
        },
        set: function (val) { realLoader = val; return true; },
        configurable: true,
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
